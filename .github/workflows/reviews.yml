name: Удаление отзывов из Telegram

# Запускается Cloudflare Worker'ом (бот), когда админ подтверждает удаление отзыва в /reviews.
# Добавление отзывов идёт через photos.yml (категория «Отзывы»).
# Событие приходит только на ветку по умолчанию (main), поэтому файл должен лежать в main.
on:
  repository_dispatch:
    types: [review_delete]
  workflow_dispatch:
    inputs:
      payload:
        description: 'Ручной запуск: JSON как у события (chat_id, numbers)'
        required: true

# Общая очередь с фото и ценами: все правят index.html
concurrency:
  group: site-content
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  delete-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAYLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.payload || toJSON(github.event.client_payload) }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - run: pip install -r .github/requirements.txt

      - name: Удалить отзывы с сайта
        id: del
        run: python .github/scripts/reviews.py event-delete

      - name: Проверка сайта перед публикацией
        if: steps.del.outputs.changed != '0'
        run: python -I .github/scripts/check_site.py

      - name: Коммит и push
        if: steps.del.outputs.changed != '0'
        env:
          SUMMARY: ${{ steps.del.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A img/reviews index.html
          git commit -m "Отзывы через Telegram: $SUMMARY"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push не прошёл (попытка $i), повторяю"; sleep $((i * 3))
          done
          exit 1

      - name: Запросить пересборку Pages
        if: steps.del.outputs.changed != '0'
        continue-on-error: true  # push обычно запускает сборку сам; это страховка
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: Сообщить об успехе
        if: steps.del.outputs.changed != '0'
        env:
          MESSAGE: "✅ ${{ steps.del.outputs.summary }}\nС сайта пропадут в течение минуты."
        run: python .github/scripts/tg_notify.py

      - name: Сообщить, что удалять нечего
        if: steps.del.outputs.changed == '0'
        env:
          MESSAGE: "ℹ️ Этих отзывов на сайте уже нет, изменений не потребовалось."
        run: python .github/scripts/tg_notify.py

      - name: Сообщить об ошибке
        if: failure()
        env:
          MESSAGE: "⚠️ Не удалось удалить отзыв: ничего не опубликовано. Подробности: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python .github/scripts/tg_notify.py
