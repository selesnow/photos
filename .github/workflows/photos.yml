name: Фото из Telegram

# Запускается Cloudflare Worker'ом (бот в Telegram), когда админ нажимает «Опубликовать».
# Событие приходит только на ветку по умолчанию (main), поэтому файл должен лежать в main.
on:
  repository_dispatch:
    types: [photos_upload]
  workflow_dispatch:
    inputs:
      payload:
        description: 'Ручной запуск: JSON как у события (batch, chat_id, category, location, files)'
        required: true

# Фото и цены правят index.html, поэтому все такие запуски идут строго по очереди (общая группа)
concurrency:
  group: site-content
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  add-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAYLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.payload || toJSON(github.event.client_payload) }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - run: pip install -r .github/requirements.txt

      - name: Скачать фото и добавить на сайт
        id: add
        run: python .github/scripts/telegram_photos.py process

      - name: Проверка сайта перед публикацией
        run: python -I .github/scripts/check_site.py

      - name: Коммит и push
        env:
          SUMMARY: ${{ steps.add.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img index.html sitemap.xml
          git commit -m "Фото через Telegram: $SUMMARY"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push не прошёл (попытка $i), повторяю"; sleep $((i * 3))
          done
          exit 1

      - name: Запросить пересборку Pages
        continue-on-error: true  # push обычно запускает сборку сам; это страховка
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: Сообщить об успехе
        env:
          MESSAGE: "✅ Добавлено: ${{ steps.add.outputs.summary }}\nНа сайте появится в течение минуты: https://christina-hurghada.photos/#portfolio"
        run: python .github/scripts/tg_notify.py

      - name: Сообщить об ошибке
        if: failure()
        env:
          MESSAGE: "⚠️ Не удалось добавить фото на сайт. Подробности: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python .github/scripts/tg_notify.py
