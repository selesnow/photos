name: Проверка автоматизаций

# Падает, если правка сайта сломала то, на что опираются бот и Action'ы (цены, добавление фото, чат,
# калькулятор). Пуши от самих Action'ов (бот) этот workflow не запускают: они и так проверяют себя при работе.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Автоматизации находят свои места на сайте
        run: python -I .github/scripts/check_site.py
      - name: Тесты механизма цен
        run: python -I .github/scripts/test_prices.py
      - name: Калькулятор во всех комбинациях (настоящий браузер)
        run: |
          npm i --no-save playwright-core@1
          npx playwright-core install --with-deps chromium
          node .github/tests/calc.test.mjs
