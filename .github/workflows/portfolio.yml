name: Управление портфолио из Telegram

# Запускается Cloudflare Worker'ом (бот), когда админ удаляет фото или меняет локацию в /portfolio.
# Событие приходит только на ветку по умолчанию (main), поэтому файл должен лежать в main.
on:
  repository_dispatch:
    types: [portfolio_manage]
  workflow_dispatch:
    inputs:
      payload:
        description: 'Ручной запуск: JSON как у события (chat_id, action, category, number/numbers, location)'
        required: true

# Общая очередь с фото, отзывами и ценами: все правят index.html
concurrency:
  group: site-content
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  manage-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAYLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.payload || toJSON(github.event.client_payload) }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - run: pip install -r .github/requirements.txt

      - name: Применить изменения в портфолио
        id: port
        run: python .github/scripts/portfolio.py event-process

      - name: Проверка сайта перед публикацией
        if: steps.port.outputs.changed != '0'
        run: python -I .github/scripts/check_site.py

      - name: Коммит и push
        if: steps.port.outputs.changed != '0'
        env:
          SUMMARY: ${{ steps.port.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A img/family img/couple img/single index.html sitemap.xml
          git commit -m "Портфолио через Telegram: $SUMMARY"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push не прошёл (попытка $i), повторяю"; sleep $((i * 3))
          done
          exit 1

      - name: Запросить пересборку Pages
        if: steps.port.outputs.changed != '0'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: Сообщить об успехе
        if: steps.port.outputs.changed != '0'
        env:
          MESSAGE: "✅ ${{ steps.port.outputs.summary }}\nНа сайте обновится в течение минуты: https://christina-hurghada.photos/#portfolio"
        run: python .github/scripts/tg_notify.py

      - name: Сообщить, если изменений нет
        if: steps.port.outputs.changed == '0'
        env:
          MESSAGE: "ℹ️ ${{ steps.port.outputs.summary }}. Изменений не потребовалось."
        run: python .github/scripts/tg_notify.py

      - name: Сообщить об ошибке
        if: failure()
        env:
          MESSAGE: "⚠️ Не удалось обновить портфолио: ничего не опубликовано. Подробности: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: python .github/scripts/tg_notify.py
